name: Build Araz Scanner Android V2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract project
        run: |
          rm -rf ArazScannerAndroidV2
          unzip -q ArazScannerAndroidV2.zip
          test -f ArazScannerAndroidV2/settings.gradle
          test -f ArazScannerAndroidV2/araz-scanner-dev.jks

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        working-directory: ArazScannerAndroidV2
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Verify APK
        run: |
          APK="ArazScannerAndroidV2/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee ArazScannerAndroidV2/app-debug.sha256
          echo "Araz Scanner 2.0 (versionCode 3)"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ArazScanner-APK-V2
          path: |
            ArazScannerAndroidV2/app/build/outputs/apk/debug/app-debug.apk
            ArazScannerAndroidV2/app-debug.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArazScanner-V2-build-log
          path: ArazScannerAndroidV2/build.log
          if-no-files-found: warn
          retention-days: 7
